apiVersion: apps/v1
kind: Deployment
metadata:
  name: emp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emp-app
  template:
    metadata:
      labels:
        app: emp-app
    spec:
      containers:
        - name: emp-app
          image: myapp-ks:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
